<main><div id="gate" class="backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="gate-title"><header><h1 id="gate-title">카피바라 4세 입양</h1></header><div class="dialog-body"><div id="consent"><p>카피바라 4세의 입양을 희망하십니까?<br>카피바라 4세를 입양하면 다양한 기능을 사용할 수 있습니다.</p><label for="display-name">희망자 이름</label><input id="display-name" maxlength="40" autocomplete="nickname" required></div><p id="gate-status" role="status"></p></div><footer id="gate-actions"><button id="cancel" type="button">취소</button><button id="join" type="button">동의</button></footer></section></div>
<section id="room" inert aria-hidden="true"><header><div><h1 id="room-title">플레이 룸</h1><p id="status" role="status">참가 대기</p></div><span id="gm-state">GM 연결 확인 중</span></header><div class="play-layout"><section class="stage" aria-label="플레이 영역"><h2>세션</h2><p>현재 세로 단면은 채팅과 공개 핸드아웃을 지원합니다.</p><article id="handout" hidden><h3 id="title"></h3><div id="body"></div><time id="updated"></time></article></section><section class="chat" aria-label="채팅"><h2>채팅</h2><ol id="messages"></ol><form id="chat-form"><label class="sr-only" for="chat-input">메시지</label><textarea id="chat-input" maxlength="2000" rows="2" placeholder="메시지를 입력" title="Enter 전송 · Shift+Enter 줄바꿈"></textarea><button type="submit">전송</button></form><p id="send-status" role="status"></p></section></div></section></main><script src="/participant.js"></script></html>
