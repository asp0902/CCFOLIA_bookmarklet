<main><section id="consent"><h1>플레이 룸 참가</h1><p>표시 이름과 채팅 내용이 GM의 릴레이 서버 및 연결된 CCFOLIA 룸으로 전달됩니다. 표시 이름은 인증 수단이 아니며, GM 승인 후에만 룸 정보를 받습니다.</p><label for="display-name">표시 이름</label><input id="display-name" maxlength="40" autocomplete="nickname" required><label class="agree"><input id="agree" type="checkbox"> 정보 처리 및 룸 공유에 동의합니다.</label><button id="join" type="button">참가 요청</button></section>
<section id="room" hidden><header><div><h1 id="room-title">플레이 룸</h1><p id="status" role="status">연결 중</p></div><span id="gm-state">GM 연결 확인 중</span></header><div class="play-layout"><section class="stage" aria-label="플레이 영역"><h2>세션</h2><p>현재 세로 단면은 채팅과 공개 핸드아웃을 지원합니다.</p><article id="handout" hidden><h3 id="title"></h3><div id="body"></div><time id="updated"></time></article></section><section class="chat" aria-label="채팅"><h2>채팅</h2><ol id="messages"></ol><form id="chat-form"><label class="sr-only" for="chat-input">메시지</label><textarea id="chat-input" maxlength="2000" rows="2" placeholder="메시지를 입력" title="Enter 전송 · Shift+Enter 줄바꿈"></textarea><button type="submit">전송</button></form><p id="send-status" role="status"></p></section></div></section><p id="gate-status" role="status">연결 전</p></main><script src="/participant.js"></script></html>
