<main><div id="gate" class="backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="gate-title"><header><h1 id="gate-title">카피바라 4세 입양</h1></header><div class="dialog-body"><div id="consent"><p>카피바라 4세의 입양을 희망하십니까?<br>카피바라 4세를 입양하면 다양한 기능을 사용할 수 있습니다.</p><label for="display-name">희망자 이름</label><input id="display-name" maxlength="40" autocomplete="nickname" required></div><p id="gate-status" role="status"></p></div><footer id="gate-actions"><button id="join" type="button">동의</button><button id="cancel" type="button">취소</button></footer></section></div>
<section id="room" inert aria-hidden="true"><header><div><h1 id="room-title">플레이 룸</h1><p id="status" role="status">참가 대기</p></div><span id="gm-state">GM 연결 확인 중</span></header><div class="play-layout"><section class="stage" aria-label="플레이 영역"><article id="handout" hidden><h3 id="title"></h3><div id="body"></div><time id="updated"></time></article></section><div id="bgm" hidden><span id="bgm-title"></span><button id="bgm-toggle" type="button">BGM 끄기</button><div id="bgm-frame"></div></div><section class="chat" aria-label="채팅"><h2>룸 채팅</h2><ol id="messages"></ol><form id="chat-form"><div class="chat-tabs" id="chat-tabs" role="tablist"></div><div class="name-row"><span class="face"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M9 11.75c-.69 0-1.25.56-1.25 1.25s.56 1.25 1.25 1.25 1.25-.56 1.25-1.25-.56-1.25-1.25-1.25zm6 0c-.69 0-1.25.56-1.25 1.25s.56 1.25 1.25 1.25 1.25-.56 1.25-1.25-.56-1.25-1.25-1.25zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8 0-.29.02-.58.05-.86 2.36-1.05 4.23-2.98 5.21-5.37C11.07 7.8 13.45 9.5 16.2 9.5c.9 0 1.77-.2 2.57-.55.14.34.23.69.23 1.05 0 4.41-3.59 8-8 8z"/></svg></span><input id="chat-name" readonly tabindex="-1" aria-label="표시 이름"><button type="submit">전송</button></div><div class="ta-wrap"><label class="sr-only" for="chat-input">메시지</label><textarea id="chat-input" maxlength="2000" rows="3" placeholder="메시지를 입력" title="Enter 전송 · Shift+Enter 줄바꿈"></textarea></div></form><p id="send-status" role="status"></p></section></div></section></main><script src="/participant.js"></script></html>
