<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>확인한 트윗</title>
<style>
  html { color-scheme: dark; }
  body { margin: 0; background: #000; color: #e7e9ea; font: 15px/1.4 "Noto Sans KR", sans-serif; }
  main { max-width: 600px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #2f3336; border-radius: 8px; margin-bottom: 16px; }
  .bar label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .item { border: 1px solid #2f3336; border-radius: 12px; margin-bottom: 16px; padding: 8px; }
  .item iframe { display: block; width: 100%; min-height: 200px; border: 0; color-scheme: dark; }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 4px 0; font-size: 13px; color: #71767b; }
  .meta a { color: #1d9bf0; }
  [hidden] { display: none !important; }
  button { cursor: pointer; border: 1px solid #FFD400; background: transparent; color: #FFD400; border-radius: 16px; padding: 4px 12px; font: inherit; }
  #more { display: block; margin: 8px auto 32px; padding: 8px 20px; }
  .empty { color: #71767b; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>✓ 확인한 트윗</h1>
  <div class="bar"><label><input type="checkbox" id="hide"> 타임라인에서 숨기기</label><span id="count"></span></div>
  <div id="list"></div>
  <button id="more" hidden>더 보기</button>
</main>
<script src="x-seen-page.js"></script>
</body>
</html>
